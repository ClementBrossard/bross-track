name: Pipeline — migration de l'historique Drive

# À lancer une fois, après avoir déposé les fichiers du Drive sous raw/ dans
# R2 (notebooks/migration_drive_vers_r2.ipynb).
on:
  workflow_dispatch:

concurrency:
  group: galoptrack-data
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-pipeline.txt
      - run: pip install -r requirements-pipeline.txt
      - name: Migration
        run: |
          set -o pipefail
          python -m galoptrack migrate | tee migration_report.md
      - name: Rapport dans le résumé du run
        if: always()
        run: cat migration_report.md >> "$GITHUB_STEP_SUMMARY"
      - run: python -m galoptrack status
