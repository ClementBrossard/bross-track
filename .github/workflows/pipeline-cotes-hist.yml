name: Pipeline — historique des cotes

# Récupère, pour les courses de plat déjà collectées, la cote de référence
# (~30 min avant le départ) et la cote directe (au départ) : table cotes_hist.
# N'écrit dans aucune autre table. Reprend là où le passage précédent s'est
# arrêté : relancer jusqu'à « 0 restantes ».
on:
  push:
    branches-ignore: [main]
    paths: ["galoptrack/cotes_hist.py", ".github/workflows/pipeline-cotes-hist.yml"]
  workflow_dispatch:

concurrency:
  group: galoptrack-cotes-hist
  cancel-in-progress: false

jobs:
  cotes-hist:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-pipeline.txt
      - run: pip install -r requirements-pipeline.txt
      - run: python -m galoptrack cotes-hist --max-minutes 320
