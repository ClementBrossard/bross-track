name: Pipeline — quotidien

# Matin : collecte des 3 derniers jours (arrivées, tracking, rapports) puis
# dashboard du jour. Midi : dashboard seul, pour rafraîchir les cotes.
# (cron en UTC : 05:40 UTC = 07:40 à Paris l'été, 06:40 l'hiver)
# GitHub ne garantit pas l'heure des tâches planifiées (retards, créneaux
# parfois sautés) : deux créneaux de secours à +1 h et +2 h, qui ne font rien
# si la collecte du jour a déjà tourné.
on:
  schedule:
    - cron: "40 5 * * *"
    - cron: "40 6 * * *"
    - cron: "40 7 * * *"
    - cron: "40 10 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "daily = collecte + dashboard, dashboard = dashboard seul"
        type: choice
        options: [daily, dashboard]
        default: daily

concurrency:
  group: galoptrack-data
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-pipeline.txt
      - run: pip install -r requirements-pipeline.txt
      - name: Run
        run: |
          MODE="${{ inputs.mode }}"
          EXTRA=""
          if [ -z "$MODE" ]; then
            if [ "${{ github.event.schedule }}" = "40 10 * * *" ]; then MODE=dashboard; else MODE=daily; EXTRA="--if-needed"; fi
          fi
          echo "Mode : $MODE $EXTRA"
          python -m galoptrack $MODE $EXTRA
