name: Pipeline — expérience poids

# Compare le modèle de production et un modèle + poids relatif sur les mêmes
# données. Lecture seule : aucun modèle enregistré, rien d'écrit dans R2.
# Résultat dans le résumé du run.
on:
  push:
    branches-ignore: [main]
    paths: ["galoptrack/experiment.py", ".github/workflows/pipeline-experiment.yml"]
  workflow_dispatch:

jobs:
  experiment:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-pipeline.txt
      - run: pip install -r requirements-pipeline.txt
      - run: python -m galoptrack experiment-poids
